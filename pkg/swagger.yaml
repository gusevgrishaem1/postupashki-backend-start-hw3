openapi: 3.0.3
info:
  title: Task service
  version: 1.0.0
  description: API for asynchronously processing tasks.
servers:
  - url: /
paths:
  /task:
    post:
      summary: Create task
      tags: [tasks]
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
                required: [task_id]
  /status/{task_id}:
    get:
      summary: Get task status
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [in_progress, ready]
                required: [status]
        "404":
          $ref: "#/components/responses/NotFound"
  /result/{task_id}:
    get:
      summary: Get task result
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskID"
      responses:
        "200":
          description: Task result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                required: [result]
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Task not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
